  # These routes should satisfy the Student Wellbeing Advisor requirements in section 4.5 of README.md.
  # Designed routes that mutate a simulation or simulation-owned state should reject ended simulations.
  # You may reuse, adapt, or replace the friend/club/course/universe schemas above, and should document any opportunity schema your group introduces.
