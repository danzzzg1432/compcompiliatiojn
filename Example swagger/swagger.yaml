      responses:
        200:
          description: OK
          schema:
            $ref: "#/x-components/return/ActionList"
        401:
          description: |
            - **UNAUTHORISED**
              - Session is empty or invalid
          schema:
            $ref: "#/x-components/return/Error"
        403:
          description: |
            - **INVALID_SIMULATION**
              - Simulation does not exist or does not belong to the authenticated student
          schema:
            $ref: "#/x-components/return/Error"
    post:
      operationId: simulationAction
      summary: Perform a simulation action
      description: Perform a prescribed activity and update the simulation state.
      tags:
        - "Iteration 2 (Designed)"
      parameters:
        - $ref: "#/x-components/path/SimulationId"
        - $ref: "#/x-components/header/Session"
        - $ref: "#/x-components/body/SimulationAction"
      responses:
        200:
          description: OK
          schema:
            $ref: "#/x-components/return/SimulationActionResult"
        400:
          description: |
            If any of the following are true:
            - **INVALID_DURATION**
              - Duration is not a positive whole number
            - **INVALID_ACTION**
              - actionName is not one of the supported activities
            - **INVALID_EXAM_ID**
              - STUDYING does not include a valid target exam
            - **STUDYING_LIMIT_EXCEEDED**
              - The student attempts to study for more than 3 consecutive hours
            - **NO_MEAL_IN_LAST_4_HOURS**
              - The student attempts to exercise without eating recently
            - **EXERCISE_LIMIT_EXCEEDED**
              - The exercise cooldown has not elapsed
            - **SIMULATION_ENDED**
              - The simulation is no longer ACTIVE
          schema:
            $ref: "#/x-components/return/Error"
        401:
          description: |
            - **UNAUTHORISED**
              - Session is empty or invalid
          schema:
            $ref: "#/x-components/return/Error"
        403:
          description: |
            - **INVALID_SIMULATION**
              - Simulation does not exist or does not belong to the authenticated student
          schema:
            $ref: "#/x-components/return/Error"

